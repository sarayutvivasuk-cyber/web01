<html>
    <head>
        
    </head>
    <body>
        <button>blue</button>
        <button>red</button>
        <button>green</button>
        <button>orange</button>
        <script>
            const btns=document.querySelectorAll("button");
            btns.forEach(btn =>{
                btn.addEventListener("click",()=>{
                    document.body.style.backgroundColor=btn.textContent;
                });
            });
        </script> 
        
    </body> 
</html>
